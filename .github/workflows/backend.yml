name: Backend checks

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_USER: vatican
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: vatican_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vatican -d vatican_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
        env:
          VD_TEST_DATABASE_URL: postgresql://vatican:ci-only-password@127.0.0.1:5432/vatican_test
