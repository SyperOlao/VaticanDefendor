services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_DB: vatican_analytics
      CLICKHOUSE_USER: analytics
      CLICKHOUSE_PASSWORD: ${VD_ANALYTICS_PASSWORD:?set a separate analytics password}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - analytics_clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 3s
      timeout: 2s
      retries: 30
  schema:
    build: .
    environment:
      VD_ANALYTICS_DATABASE_URL: ${VD_ANALYTICS_DATABASE_URL:?set clickhouse+http://analytics:URL_ENCODED_PASSWORD@clickhouse:8123/vatican_analytics}
    depends_on:
      clickhouse:
        condition: service_healthy
volumes:
  analytics_clickhouse_data:
