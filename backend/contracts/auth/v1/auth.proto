syntax = "proto3";
package vatican.auth.v1;

// Read-only token introspection. Metadata: authorization: Bearer <player token>,
// x-service-secret: <server credential>. Never log either credential.
service AuthService {
  rpc Authenticate (AuthenticateRequest) returns (AuthenticateReply);
}

message AuthenticateRequest {}
message AuthenticateReply {
  string account_id = 1;
  optional bool is_guest = 2; // Presence is required; missing data must fail closed.
  repeated string roles = 3;
  repeated string permissions = 4;
  optional string session_id = 5;
}
