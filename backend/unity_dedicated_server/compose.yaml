services:
  unity_server:
    image: vatican-dedicated-server:local
    platform: linux/amd64
    build:
      context: .
      target: server
    environment:
      VD_SIMULATION_HZ: ${VD_SIMULATION_HZ:-60}
      VD_SNAPSHOT_HZ: ${VD_SNAPSHOT_HZ:-30}
      VD_BACKEND_URL: ${VD_BACKEND_URL:?set HTTPS backend URL}
      VD_SERVER_SECRET: ${VD_SERVER_SECRET:?set the existing backend pool secret}
      VD_CONTENT_RELEASE_ID: ${VD_CONTENT_RELEASE_ID:?set the pinned content release}
      VD_DTLS_CERT_FILE: /run/secrets/game-server.crt
      VD_DTLS_KEY_FILE: /run/secrets/game-server.key
    command:
      - -vdBind
      - 0.0.0.0
      - -vdPort
      - "${VD_SERVER_PORT:-7979}"
      - -vdServerId
      - ${VD_SERVER_ID:?set the existing backend pool server UUID}
      - -vdDtls
    ports:
      - "${VD_SERVER_PORT:-7979}:${VD_SERVER_PORT:-7979}/udp"
    volumes:
      - server_state:/var/lib/vatican
      - ${VD_DTLS_CERT_PATH:?set certificate file path}:/run/secrets/game-server.crt:ro
      - ${VD_DTLS_KEY_PATH:?set private key file path}:/run/secrets/game-server.key:ro
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  server_state:
